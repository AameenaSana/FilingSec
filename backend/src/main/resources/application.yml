spring:
  application:
    name: filinglens
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    jdbc:
      initialize-schema: never
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      completion-mode: delete
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

filinglens:
  app:
    public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:FilingLens <no-reply@localhost>}
    log-content: false
  company:
    profile-max-age: PT24H
    directory-sync:
      enabled: true
      cron: "0 0 6 * * *"
  filing:
    list-max-age: PT1H
  monitoring:
    # Polls SEC for new filings of watched companies (needs SEC_USER_AGENT).
    enabled: ${MONITORING_ENABLED:true}
    poll-interval: ${MONITORING_POLL_INTERVAL:PT15M}
    check-interval: PT1M
    auto-compare: true
    max-filings-per-discovery: 10
  ai:
    # Never commit keys: set LLM_API_KEY (or ANTHROPIC_API_KEY) in the environment.
    api-key: ${LLM_API_KEY:${ANTHROPIC_API_KEY:}}
    model: ${LLM_MODEL:claude-opus-5-5}
    max-output-tokens: 64000
    effort: medium
    daily-token-limit-per-user: 2000000
  research:
    embeddings:
      api-key: ${EMBEDDING_API_KEY:}
      base-url: https://api.voyageai.com
      model: ${EMBEDDING_MODEL:voyage-4}
      dimensions: 1024
      batch-size: 64
    passages-per-answer: 12
  identity:
    max-failed-logins: 5
    lockout-duration: PT15M
    email-verification-ttl: PT24H
    password-reset-ttl: PT1H
  sec:
    user-agent: ${SEC_USER_AGENT}
    www-base-url: https://www.sec.gov
    data-base-url: https://data.sec.gov
    max-requests-per-second: 8
    request-timeout: PT30S
    throttle-pause: PT10M
  storage:
    root-path: ${STORAGE_ROOT:./data/blobs}
  jobs:
    enabled: true
    poll-interval: PT2S
    batch-size: 5
    lock-timeout: PT15M

# With TEST_DB_URL set, integration tests use that server instead of Testcontainers.
spring:
  datasource:
    url: ${TEST_DB_URL:}
    username: ${TEST_DB_USERNAME:filinglens}
    password: ${TEST_DB_PASSWORD:}
filinglens:
  sec:
    user-agent: "FilingLens test test@example.com"
  storage:
    root-path: ${java.io.tmpdir}/filinglens-test-blobs
  company:
    directory-sync:
      # Tests never call SEC.
      enabled: false
  monitoring:
    # Tests never call SEC.
    enabled: false
  jobs:
    # Tests drive the worker explicitly instead of relying on the scheduler.
    enabled: false

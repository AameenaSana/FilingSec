name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # Docker is available on GitHub-hosted runners, so Testcontainers tests run here.
      - run: ./gradlew --no-daemon build
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: filinglens
          POSTGRES_USER: filinglens
          POSTGRES_PASSWORD: filinglens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U filinglens" --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.4
        ports: ["1025:1025", "8025:8025"]
    env:
      E2E_EXTERNAL_STUB: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build backend
        working-directory: backend
        run: ./gradlew --no-daemon bootJar -x test
      - name: Start SEC stub
        working-directory: frontend
        run: nohup node e2e/stub-sec.mjs 4010 > stub-sec.log 2>&1 &
      - name: Start backend
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/filinglens
          DB_USERNAME: filinglens
          DB_PASSWORD: filinglens
          SEC_USER_AGENT: "FilingLens E2E e2e@example.com"
          FILINGLENS_SEC_WWWBASEURL: http://localhost:4010
          FILINGLENS_SEC_DATABASEURL: http://localhost:4010
          SPRING_MAIL_HOST: localhost
          SPRING_MAIL_PORT: "1025"
          APP_PUBLIC_URL: http://localhost:3000
          MONITORING_ENABLED: "false"
          STORAGE_ROOT: ${{ runner.temp }}/blobs
        run: |
          nohup java -jar build/libs/app.jar > backend.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/actuator/health/readiness && exit 0
            sleep 2
          done
          cat backend.log; exit 1
      - name: Build frontend
        working-directory: frontend
        env:
          BACKEND_URL: http://localhost:8080
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test
      - if: failure()
        name: Show logs
        run: |
          tail -n 300 backend/backend.log || true
          cat frontend/stub-sec.log || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t filinglens-backend ./backend
      - run: docker build -t filinglens-frontend ./frontend
